<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRKT Sniper</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#09070e;color:#f7f2ff;font:14px/1.45 system-ui}main{max-width:440px;min-height:100vh;margin:auto;padding:16px;background:linear-gradient(180deg,#171321,#0e0b14)}header{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;margin-bottom:18px}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid #d8b2ff;outline-offset:3px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.tabs button{border:0;background:#21182c;color:#cbb7da;border-radius:9px;padding:10px 3px;font-size:12px;min-height:44px}.tabs button.active{background:#6b3a94;color:white}.hero,.card{margin-top:15px;padding:16px;border-radius:16px;background:#21182c;border:1px solid #4c3264}.hero{background:linear-gradient(135deg,#49226c,#24133a)}h1{font-size:25px;margin:10px 0 6px}h2{font-size:21px}.muted,small{color:#b6a9c0}.gift{display:flex;gap:8px;align-items:center;border-bottom:1px solid #382944;padding:12px 0}.open{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:0}.open span{overflow-wrap:anywhere}.price{color:#e3b7ff;white-space:nowrap}.heart{background:none;border:0;font-size:23px;padding:8px;color:#e3b7ff}.thumb{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#35224b}.large{width:112px;height:112px;border-radius:22px;object-fit:contain;background:#35224b}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #382944}.row>*{overflow-wrap:anywhere}.btn{display:block;width:100%;text-align:center;margin-top:10px;padding:12px;border:0;border-radius:9px;background:#b980f3;color:#180e25;text-decoration:none}.back{background:none;border:0;color:#cda3ff;padding:12px 0}.risk{padding:12px;margin-top:12px;border-radius:10px;background:#3a1f47}input,select{width:100%;padding:12px;border:1px solid #4b3860;border-radius:9px;background:#110e17;color:white}.link{display:block;color:#d6b4ff;overflow-wrap:anywhere;margin-top:10px}#status{font-size:12px;margin-top:12px}.journal{font-size:12px;border:0;border-radius:14px;background:#281844;color:#d8bfff;padding:8px}small{display:block}[hidden]{display:none!important}
</style></head><body><main><header><span>✦ MRKT Sniper</span><button class="journal" id="refresh">↻ Обновить</button></header><nav class="tabs" aria-label="Разделы"><button data-tab="feed" class="active">Лента</button><button data-tab="saved">Избранное</button><button data-tab="deals">Мои сделки</button><button data-tab="check">Проверить</button></nav><div id="status" role="status">Загрузка данных MRKT…</div><section id="content"></section></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id), content=$('content');let tab='feed',collections=[],items=[],selected=null;
const storageKey='mrkt-favorites-v1-'+(tg?.initDataUnsafe?.user?.id||'guest');let favorites=[];try{favorites=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(favorites))favorites=[]}catch{}
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e}
function safeLink(url){try{const u=new URL(url);const valid=u.protocol==='https:'&&u.hostname==='t.me'&&((u.pathname==='/mrkt/app'&&u.searchParams.has('startapp'))||u.pathname.startsWith('/nft/'));return valid?u.href:null}catch{return null}}
function openMrkt(url){if(tg?.openTelegramLink){tg.openTelegramLink(url)}else{location.href=url}}
function image(row,parent,large=false){if(typeof row.image==='string'&&row.image.startsWith('https://')){const i=el('img',undefined,parent,large?'large':'thumb');i.src=row.image;i.alt=row.title;i.loading='lazy';i.onerror=()=>i.replaceWith(document.createTextNode('Изображение недоступно'))}else el('span','◇',parent,large?'large':'thumb')}
function key(r){return r.link||r.collection+'|'+r.title}
function price(r){return typeof r.amount==='number'&&Number.isFinite(r.amount)?new Intl.NumberFormat('ru',{maximumFractionDigits:9}).format(r.amount/1e9)+' г':'Цена не передана'}
function show(id){tab=id;selected=null;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===id);b.setAttribute('aria-pressed',b.dataset.tab===id)});render()}
function list(rows,parent){if(!rows.length){el('p','Подарков в этой выборке пока нет.',parent,'muted');return}for(const r of rows.slice(0,100)){const line=el('div',undefined,parent,'gift'),b=el('button',undefined,line,'open');image(r,b);const t=el('span',r.title,b);el('small',r.status||'Объявление',t);b.onclick=()=>detail(r);el('span',price(r),line,'price');const f=el('button',favorites.some(x=>key(x)===key(r))?'♥':'♡',line,'heart');f.setAttribute('aria-label','Избранное: '+r.title);f.onclick=()=>{const i=favorites.findIndex(x=>key(x)===key(r));i<0?favorites.push(r):favorites.splice(i,1);try{localStorage.setItem(storageKey,JSON.stringify(favorites))}catch{$('status').textContent='Не удалось сохранить избранное на устройстве.'}render()}}}
function render(){content.replaceChildren();if(tab==='feed'){const hero=el('section',undefined,content,'hero');el('small','✦ МОНИТОРИНГ ПОДАРКОВ',hero);el('h1','Сигналы MRKT',hero);el('div','Подарки, цены и история продаж.',hero,'muted');el('h2','Новые сигналы',content);list(items,el('section',undefined,content,'card'))}else if(tab==='saved'){el('h2','Избранное',content);el('p','Сохранено на этом устройстве.',content,'muted');list(favorites,el('section',undefined,content,'card'))}else if(tab==='deals'){el('h2','Мои сделки',content);el('p','Личная история сделок пока не подключена. Покупки выполняются вручную в MRKT.',el('section',undefined,content,'card'),'muted')}else{el('h2','Проверить подарок',content);const form=el('form',undefined,content,'card');const label=el('label','Ссылка на подарок или название',form);const input=el('input',undefined,label);input.placeholder='Ссылка или название подарка';input.required=true;const b=el('button','Проверить',form,'btn');b.type='submit';const result=el('div',undefined,form);form.onsubmit=e=>{e.preventDefault();const q=input.value.trim().toLowerCase();const matches=items.filter(r=>(r.link||'').toLowerCase()===q||r.title.toLowerCase().includes(q));result.replaceChildren();if(matches.length)list(matches,result);else el('p','Подарок не найден в загруженных данных.',result)}}}
function row(parent,k,v){const d=el('div',undefined,parent,'row');el('span',k,d);el('span',typeof v==='string'||typeof v==='number'?v:'Нет данных',d)}
function detail(r){selected=r;content.replaceChildren();el('button','← Назад',content,'back').onclick=render;const hero=el('section',undefined,content,'hero');image(r,hero,true);el('h1',r.title,hero);el('div',price(r),hero,'price');const link=safeLink(r.link);const links=el('section',undefined,content,'card');el('b','Ссылка на подарок',links);if(link){const a=el('a',link,links,'link');a.href='#';a.onclick=e=>{e.preventDefault();openMrkt(link)};const b=el('button','Открыть на MRKT',links,'btn');b.type='button';b.onclick=()=>openMrkt(link)}else el('p','Источник пока не передал ссылку на MRKT.',links,'muted');el('small','Покупка вручную в MRKT.',links);const attrs=el('section',undefined,content,'card');el('b','Характеристики',attrs);row(attrs,'Коллекция',r.collection);row(attrs,'Модель',r.model);row(attrs,'Фон',r.backdrop);row(attrs,'Узор',r.pattern);const history=el('section',undefined,content,'card');el('b','Последние продажи коллекции',history);const period=el('select',undefined,history);period.setAttribute('aria-label','Период продаж');for(const [h,t]of [[24,'24 часа'],[168,'7 дней'],[720,'30 дней']])period.add(new Option(t,h));period.value='168';const salesBox=el('div',undefined,history),risk=el('section',undefined,content,'card');function update(){salesBox.replaceChildren();risk.replaceChildren();const c=collections.find(c=>c.name===r.collection);const sales=(c?.sales||[]).filter(s=>Number.isFinite(s.amount)&&Date.parse(s.date)>=Date.now()-Number(period.value)*3600000).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));for(const s of sales.slice(0,20))row(salesBox,new Date(s.date).toLocaleString('ru'),price(s));if(!sales.length)el('p','Продаж за выбранный период в источнике нет.',salesBox,'muted');el('b','Анализ риска',risk);el('small','По загруженным продажам коллекции; совпадение модели и фона не подтверждено.',risk);if(sales.length<5){el('div','Недостаточно данных для оценки риска.',risk,'risk');return}const values=sales.map(s=>s.amount).sort((a,b)=>a-b),n=values.length,median=(values[Math.floor((n-1)/2)]+values[Math.floor(n/2)])/2;row(risk,'Продаж за период',n);row(risk,'Медианная цена',price({amount:median}));const flags=[];if(median>0&&r.amount>median*1.2)flags.push('Цена более чем на 20% выше медианы');if(Date.now()-Date.parse(sales[0].date)>48*3600000)flags.push('Последняя продажа старше 48 часов');if(median>0&&(values[n-1]-values[0])/median>.5)flags.push('Большой разброс цен');el('div',flags.length?flags.join('. '):'По этой выборке предупреждений нет. Это не гарантия продажи.',risk,'risk')}period.onchange=update;update()}
let busy=false;async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;try{const response=await fetch('./api/market',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_user_id:tg?.initDataUnsafe?.user?.id,telegram_init_data:tg?.initData||''}),signal:AbortSignal.timeout(65000)});if(!response.ok)throw Error();const data=await response.json();if(!Array.isArray(data.collections))throw Error();collections=data.collections;items=collections.flatMap(c=>(c.listings||[]).map(r=>({...r,collection:c.name})));$('status').textContent=(data.source?'Источник: '+data.source+'. ':'')+'Лотов: '+items.length+'. Обновлено '+new Date().toLocaleTimeString('ru');if(!selected)render()}catch{$('status').textContent='Данные временно недоступны. Откройте приложение из Telegram и нажмите «Обновить».'}finally{busy=false;$('refresh').disabled=false}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('refresh').onclick=refresh;render();refresh();
</script></body></html>
